name: Security Checks

on:
push:
branches: ["main"]
pull_request:
branches: ["main"]

jobs:
security:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Verify HTML files
    run: find . -name "*.html"

  - name: Verify CSS files
    run: find . -name "*.css"

  - name: Search for potential secrets
    run: |
      if grep -R \
        --exclude-dir=.git \
        --exclude-dir=.github \
        -E "password|apikey" .; then
          echo "Potential secret found!"
          exit 1
      fi

  - name: Security check completed
    run: echo "No issues found"
```
